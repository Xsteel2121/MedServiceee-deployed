name: Kazakhstan stack build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend container
        run: docker build --file deploy/kz/frontend.Dockerfile --tag medservice-frontend:ci .
      - name: Build backend container
        run: docker build --file backend/Dockerfile --tag medservice-backend:ci backend
