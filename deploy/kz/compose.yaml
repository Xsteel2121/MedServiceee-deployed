services:
  frontend:
    build:
      context: ../..
      dockerfile: deploy/kz/frontend.Dockerfile
    restart: unless-stopped
    networks:
      - private

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: medservice
      POSTGRES_USER: medservice
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/kz/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medservice -d medservice"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in deploy/kz/.env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in deploy/kz/.env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in deploy/kz/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in deploy/kz/.env}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      ENVIRONMENT: production
      ENABLE_EXTERNAL_AI_FALLBACK: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in deploy/kz/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - private

networks:
  private:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
